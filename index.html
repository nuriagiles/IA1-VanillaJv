<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA1 - Vanilla JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>IA1 - Vanilla JS</h1>

    <h2>Funciones y return</h2>
    <div id="resultado"></div>
    <div id="resultado2"></div>
    <button id="btn" type="button">sumar</button>
    <button id="btn2" type="button">multiplicar</button>

    <h2>Condicionales y operador ternari</h2>
    <input type="text" id="input">
    <button id="btn3">comparar</button>
    
    <h2>Switch e estados del juego</h2>
    <button id="btn4">cambiar estado</button>

    <h2>Selector del DOM</h2>
    <div id="caja1" class="caja">Caja 1</div>

    <h2>boton de dado y turnos</h2>
    <button id="btn5">tirar dado</button>

    <h2>Formulario basico y evento submit</h2>
    <form id="formulario">
        <input type="text" id="nombre" placeholder="Jugador">
        <button type="submit" id="btn6">Enviar</button>
    </form>

    <h2>Array de preguntas y objetos</h2>
    <div id="pregunta1" class="pregunta">Barcelona</div>
    <div id="pregunta2" class="pregunta">Madrid</div>
    <div id="pregunta3" class="pregunta">Valencia</div>

    <script src="index.js"></script>
</body>
</html>
