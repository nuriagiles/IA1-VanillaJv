<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA1 - Vanilla JavaScript</title>
    <style>
        .tablero-panel-container{
            display: flex;
            justify-content: space-around;
            margin-bottom: 80px;
        }
        .panel-actividad{
            border: 10px solid green;
            border-radius: 15px;
        }
        #tablero {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 600px;
            height: 600px;
            background-color: #1A3582; /* Fondo azul del tablero */
            padding: 15px;
            border-radius: 30px;
            box-sizing: border-box;
            gap: 5px;
            position: ;
        }

        .Casillas {
            border: 3px solid #ffffff; /* Líneas blancas divisorias */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffffff;
            box-sizing: border-box;
        }

        /* ==========================================
        MAPEO CORREGIDO EN ESPIRAL (1 AL 36)
        ========================================== */

        /* 1. Inicio y Borde Izquierdo (1 a 7) */
        .Casillas[data-id="0"]  { display: none;}
        .Casillas[data-id="1"]  { grid-column: 1; grid-row: 6; background-color: #F4B021; }
        .Casillas[data-id="2"]  { grid-column: 1; grid-row: 5; background-color: #DD6F37; }
        .Casillas[data-id="3"]  { grid-column: 1; grid-row: 4; background-color: #C3352D; }
        .Casillas[data-id="4"]  { grid-column: 1; grid-row: 3; background-color: #C32172; }
        .Casillas[data-id="5"]  { grid-column: 1; grid-row: 2; background-color: #D57BA3; }
        .Casillas[data-id="6"]  { grid-column: 1; grid-row: 1; background-color: #BDADC5; }
        .Casillas[data-id="7"]  { grid-column: 2; grid-row: 1; background-color: #8B6493; }

        /* 2. Borde Superior (8 a 13) */
        .Casillas[data-id="8"]  { grid-column: 3; grid-row: 1; background-color: #601468; }
        .Casillas[data-id="9"]  { grid-column: 4; grid-row: 1; background-color: #37013D; }
        .Casillas[data-id="10"] { grid-column: 5; grid-row: 1; background-color: #2F165B; }
        .Casillas[data-id="11"] { grid-column: 6; grid-row: 1; background-color: #244A89; }
        .Casillas[data-id="12"] { grid-column: 7; grid-row: 1; background-color: #1677A3; }
        .Casillas[data-id="13"] { grid-column: 7; grid-row: 2; background-color: #0394B9; }

        /* 3. Borde Derecho (14 a 18) */
        .Casillas[data-id="14"] { grid-column: 7; grid-row: 3; background-color: #7BB3B8; }
        .Casillas[data-id="15"] { grid-column: 7; grid-row: 4; background-color: #A0980E; }
        .Casillas[data-id="16"] { grid-column: 7; grid-row: 5; background-color: #8D900D; }
        .Casillas[data-id="17"] { grid-column: 6; grid-row: 5; background-color: #237801; }
        .Casillas[data-id="18"] { grid-column: 5; grid-row: 5; background-color: #37013D; }

        /* 4. Borde Inferior (19 a 23) */
        .Casillas[data-id="19"] { grid-column: 4; grid-row: 5; background-color: #601468; }
        .Casillas[data-id="20"] { grid-column: 3; grid-row: 5; background-color: #815783; }
        .Casillas[data-id="21"] { grid-column: 2; grid-row: 5; background-color: #C87292; }
        .Casillas[data-id="22"] { grid-column: 2; grid-row: 4; background-color: #C32172; }
        .Casillas[data-id="23"] { grid-column: 2; grid-row: 3; background-color: #C3352D; }

        /* 5. Primer Anillo Interno - Sube por la izquierda interior (24 a 28) */
        .Casillas[data-id="24"] { grid-column: 2; grid-row: 2; background-color: #DD6F37; }
        .Casillas[data-id="25"] { grid-column: 3; grid-row: 2; background-color: #F4B021; }
        .Casillas[data-id="26"] { grid-column: 4; grid-row: 2; background-color: #E9B73A; }
        .Casillas[data-id="27"] { grid-column: 5; grid-row: 2; background-color: #B4AE13; }
        .Casillas[data-id="28"] { grid-column: 6; grid-row: 2; background-color: #969911; }

        /* 6. Gira hacia la derecha por arriba (29 a 31) */
        .Casillas[data-id="29"] { grid-column: 6; grid-row: 3; background-color: #195E07; }
        .Casillas[data-id="30"] { grid-column: 6; grid-row: 4; background-color: #1E0051; }
        .Casillas[data-id="31"] { grid-column: 5; grid-row: 4; background-color: #256095; }

        /* 7. Baja por el lado interno derecho (32 y 33) */
        .Casillas[data-id="32"] { grid-column: 4; grid-row: -4; background-color: #0AA7CC; }
        .Casillas[data-id="33"] { grid-column: 3; grid-row: 4; background-color: #89CBDA; }
        /* (Nota: Ajusté las filas 32 y 33 para que conecten perfectamente con la curva superior) */

        /* 8. Centro / Meta final (34 a 36) */
        .Casillas[data-id="34"] { grid-column: 3; grid-row: 3; background-color: #B8ABBC; }
        .Casillas[data-id="35"] { grid-column: 4; grid-row: 3; background-color: #7C5581; }
        .Casillas[data-id="36"] { grid-column: 5; grid-row: 3; background-color: #2A0130; }
        .jugador1{
            --mover-x: 0px;
            --mover-y: 0px;
            position: absolute;
            background-color: red;
            border: 2px solid black;
            border-radius: 100%;
            width: 30px;
            height: 30px;
            align-self: center;            
            /* Combinamos tu translate fijo con las variables dinámicas */
            transform: translate(calc(-40px + var(--mover-x)), var(--mover-y));
            transition: transform 0.3s ease; /* Para que el movimiento sea suave */
        }
        .jugador2{
            --mover-x: 0px;
            --mover-y: 0px;
            position: absolute;
            background-color: blue;
            border-radius: 100%;
            border: 2px solid black;
            width: 30px;
            height: 30px;
            align-self: center;
            transform: translate(var(--mover-x), var(--mover-y));
            transition: transform 0.3s ease;
        }
        .jugadores-container{
            display: flex;
            gap: 30px;
            justify-content: space-around;
        }
        .dado{
            width: 50px;
            height: 50px;
            border: 1px solid black;
            border-radius: 10px;
        }
        .jugadorB, .jugadorA{
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .fichas-container{
            transform: translate(-40px, 43px);
        }
        .title-json{
            height: 100px;
            background-color: green;
            color: white;
            align-content: center;
        }
        .pregunta-container{
            border: 1px solid black;
            width: 400px;
            height: 300px;
        }
        .ocultar{
            display: none;
        }
        .actividad{
            width: 186px;
            height: 480px;
            overflow: scroll;
        }
    </style>
</head>
<body>
    <div class="tablero-panel-container">
        <div id="tablero">
            
        </div>
        <div class="pregunta-container ocultar">

        </div>
        <div class="panel-actividad">
            <div class="title-json">
               <h1>Estado de la partida JSON</h1> 
            </div>
            
            <div class="actividad">

            </div>
        </div>

    </div>
    
    
    

    <div class="jugadores-container">
        <button onclick="EstadoInicio()" class="boton-iniciar">Iniciar juego</button>
        <div class="jugadorA">
            <div class="dado"></div>
            <div>
                <h2>Jugador A</h2>
                <button onclick="TirarDadoA()" class="dadoA">Tirar dado</button>
            </div>
            
        </div>
        <div class="jugadorB">
            <div class="dado"></div>
            <div>
                <h2>Jugador B</h2>
                <button onclick="TirarDadoB()" class="dadoB">Tirar dado</button>
            </div>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
